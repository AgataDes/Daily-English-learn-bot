name: Daily English Bot

on:
  schedule:
    - cron: '0 8 * * *' # To jest 10:00 rano czasu polskiego (8:00 UTC)
  workflow_dispatch: # To doda przycisk "Run" - testowanie ręczne

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests deep-translator

      - name: Run Python script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python script_ang.py